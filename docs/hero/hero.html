<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strom-Widget hero</title>
<style>
  /* Source of docs/img/hero.png. Render: chrome --headless --screenshot --window-size=1600,860 hero.html */
  :root {
    --ground: #090b0f;
    --ink: #f2f5f9;
    --ink-2: #9aa3b2;
    --accent: #22c55e;
    --a: #00a651; --b: #4cb848; --c: #bfd730; --d: #fff200; --e: #fdb913; --f: #f37021; --g: #ed1c24;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 860px; background: var(--ground); overflow: hidden; }
  body {
    color: var(--ink);
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 1fr 520px;
    grid-template-rows: 1fr 118px;
    column-gap: 72px;
    padding: 72px 80px 0 80px;
  }
  .copy { grid-column: 1; grid-row: 1; align-self: center; padding-bottom: 8px; }
  h1 {
    font-size: 104px; line-height: 0.95; letter-spacing: -0.035em; font-weight: 650;
    max-width: 860px;
  }
  .lede {
    margin-top: 36px; font-size: 28px; line-height: 1.4; color: var(--ink);
    max-width: 760px; font-weight: 400;
  }
  .strip { margin-top: 56px; display: block; width: 524px; height: 72px; border-radius: 16px; }
  /* The icon from assets/icon.svg without its rounded square: ring, arc and bolt. */
  .mark {
    grid-column: 2; grid-row: 1 / 3; align-self: center;
    width: 520px; height: 520px; margin-top: -72px;
  }
  .label { grid-column: 1; grid-row: 2; align-self: end; display: flex; gap: 10px; padding-bottom: 48px; }
  .label span {
    flex: 1; height: 54px; display: flex; align-items: center; padding-left: 18px;
    font-size: 28px; font-weight: 700; color: #0b0b0c;
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
  }
  .label span.on { height: 70px; margin-top: -8px; font-size: 34px; }
</style>
</head>
<body>
  <div class="copy">
    <h1>What your PC costs, right now.</h1>
    <p class="lede">A small Windows 11 widget in your taskbar. It reads the real CPU and GPU power, estimates the rest and turns watts into money, live.</p>
    <img class="strip" src="../img/compact-strip.png" alt="The collapsed strip as it sits in the taskbar">
  </div>
  <svg class="mark" viewBox="26 26 204 204" role="img" aria-label="The Strom-Widget icon">
    <circle cx="128" cy="128" r="90" fill="none" stroke="#3C3C3D" stroke-width="12"/>
    <circle cx="128" cy="128" r="90" fill="none" stroke="#10936B" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="424 566" transform="rotate(135 128 128)"/>
    <path fill="#FFFFFF" d="M143 52 L88 138 H119 L108 204 L168 114 H136 Z"/>
  </svg>
  <div class="label" aria-label="EU energy classes A to G, the widget is in class B">
    <span style="background:var(--a)">A</span>
    <span class="on" style="background:var(--b)">B</span>
    <span style="background:var(--c)">C</span>
    <span style="background:var(--d)">D</span>
    <span style="background:var(--e)">E</span>
    <span style="background:var(--f)">F</span>
    <span style="background:var(--g)">G</span>
  </div>
</body>
</html>
