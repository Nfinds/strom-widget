name: Release

# Builds Strom-Widget.exe on GitHub and publishes it as a release
# whenever a version tag like v2.0.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Build
        run: .\build-release.ps1

      - name: Checksum
        run: |
          $hash = (Get-FileHash Strom-Widget.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Strom-Widget.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Strom-Widget.exe SHA256SUMS.txt `
            --title "Strom-Widget ${{ github.ref_name }}" `
            --generate-notes
